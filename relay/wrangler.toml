# The online-play relay: hands out lobby codes, passes messages between the host's game and its friends'
# browsers, and serves the web client friends open to join. Deploy with `npm run deploy` (after
# `npx wrangler login`); the bridge is pointed at it with -Drelay.url or CLOWNFISH_RELAY.
name = "mtgclownfish-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# the built client (npm run build in ../client); requests for real files are served from here,
# everything else (/host, /join/<code>) reaches the Worker
[assets]
directory = "../client/dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby"]
